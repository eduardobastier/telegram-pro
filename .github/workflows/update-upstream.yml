name: Update upstream

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a new official Telegram commit
        id: check
        run: |
          NEW=$(git ls-remote https://github.com/DrKLO/Telegram.git refs/heads/master | cut -f1)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$(cat UPSTREAM_REF)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Re-apply patches on the new base
        if: steps.check.outputs.changed == 'true'
        id: apply
        continue-on-error: true
        run: scripts/update-upstream.sh "${{ steps.check.outputs.new }}"

      - name: Release new version
        if: steps.check.outputs.changed == 'true' && steps.apply.outcome == 'success'
        id: release
        env:
          NEW: ${{ steps.check.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_VERSION=$(grep '^APP_VERSION_NAME=' Telegram/gradle.properties | cut -d= -f2)
          LAST=$(grep -m1 -o '^## v[0-9]*\.[0-9]*\.[0-9]*' CHANGELOG.md | cut -c4-)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          python3 - "$VERSION" "$BASE_VERSION" <<'PY'
          import sys
          version, base = sys.argv[1], sys.argv[2]
          text = open('CHANGELOG.md').read()
          entry = f"## {version}\n- Base atualizada para o Telegram {base}\n- Todos os recursos do Telegram Pro mantidos\n\n"
          i = text.index('## ')
          open('CHANGELOG.md', 'w').write(text[:i] + entry + text[i:])
          PY
          git add UPSTREAM_REF patches CHANGELOG.md
          git commit -m "Update base to Telegram ${BASE_VERSION} (DrKLO/Telegram@${NEW:0:7})"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Open pull request for conflicts
        if: steps.check.outputs.changed == 'true' && steps.apply.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.check.outputs.new }}
        run: |
          BRANCH="update-upstream-${NEW:0:7}"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "$NEW" > UPSTREAM_REF
          git add UPSTREAM_REF
          git commit -m "Update base to DrKLO/Telegram@${NEW:0:7}"
          git push origin "$BRANCH"
          gh pr create --title "Atualizar base para DrKLO/Telegram@${NEW:0:7} (conflito)" \
            --body "Nova versão do Telegram oficial: https://github.com/DrKLO/Telegram/commit/${NEW}

          ⚠️ Os patches **não aplicaram** limpo na nova base, então nada foi publicado.
          Rode \`scripts/setup.sh\` localmente nesta branch, resolva os conflitos em \`Telegram/\`, rode \`git -C Telegram am --continue\` e \`scripts/export-patches.sh\`, faça commit e crie a tag da versão."

  build:
    needs: update
    if: needs.update.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update.outputs.version }}
      version: ${{ needs.update.outputs.version }}
    secrets: inherit
