name: CI bot

# Keeps the CI bot online: long-polls Telegram for commands sent by the admin in the private
# CI group (/buildmain, /builddev, /release, /update, /status, /help) and answers right away.
# A run lasts ~5h50 (GitHub's job limit is 6 h); the schedule queues the next one, which starts
# as soon as the current run ends.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Answer commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
          CI_ADMIN_ID: ${{ secrets.CI_ADMIN_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          STOP_AFTER: "21000"
        run: .github/scripts/bot.sh
